<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link
        rel="stylesheet"
        href="editar.css"
    >

    <title>Editar filme</title>
</head>

<body>

    <main class="formulario-container">

        <a
            class="voltar"
            href="../index.html"
        >
            ← Voltar para o catálogo
        </a>


        <section class="formulario-card">

            <p class="eyebrow">GERENCIAMENTO</p>

            <h1>Editar filme</h1>

            <p class="formulario-descricao">
                Altere as informações abaixo e salve as modificações.
            </p>


            <form id="formulario-edicao">

                <div class="campo campo-grande">

                    <label for="title">
                        Título
                    </label>

                    <input
                        type="text"
                        id="title"
                    >

                </div>


                <div class="campo">

                    <label for="gender">
                        Gênero
                    </label>

                    <input
                        type="text"
                        id="gender"
                    >

                </div>


                <div class="campo">

                    <label for="ageLimit">
                        Classificação
                    </label>

                    <input
                        type="number"
                        id="ageLimit"
                        min="0"
                    >

                </div>


                <div class="campo">

                    <label for="duration">
                        Duração em minutos
                    </label>

                    <input
                        type="number"
                        id="duration"
                        min="1"
                    >

                </div>


                <div class="formulario-acoes">

                    <a
                        class="botao-secundario"
                        href="../index.html"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="botao-principal"
                    >
                        Salvar alterações
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="editar.js"></script>

</body>

</html>
